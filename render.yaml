# Render Blueprint — 공모온 단일 서비스(Docker): 백엔드 FastAPI + 프론트 SPA
# 동시 서빙. DB는 별도 Neon(PostgreSQL) 접속 문자열을 DATABASE_URL로 넣는다.
# Render 대시보드에서 New + → Blueprint로 이 리포지토리를 고르면 서비스가
# 만들어진다. sync: false 항목은 생성 과정에서 직접 입력하는 비밀값이다.
services:
  - type: web
    name: gongmo-on
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
