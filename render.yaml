# Render Blueprint — 공모온 백엔드(FastAPI) + PostgreSQL.
# Render 대시보드에서 New + → Blueprint로 이 리포지토리를 고르면
# 서비스와 DB가 한 번에 만들어진다. sync: false 항목은 생성 과정에서
# 직접 값을 입력해야 하는 비밀값(backend/.env의 값)이다.
services:
  - type: web
    name: gongmo-on-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        fromDatabase:
          name: gongmo-on-db
          property: connectionString
      - key: OPENAI_MODEL
        value: openai/gpt-5.6-luna
      - key: CLIENT_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false

databases:
  - name: gongmo-on-db
    databaseName: gongmo_on
    user: gongmo
    plan: free
