# 공모온: Render 무료 Docker 웹서비스 + 외부 Neon PostgreSQL
# 이 Blueprint는 Render PostgreSQL을 생성하지 않습니다.
# Neon 무료 프로젝트에서 연결 문자열을 복사해 DATABASE_URL에 입력하세요.
# DATABASE_URL 등 비밀값은 GitHub에 커밋하지 마세요.
services:
  - type: web
    name: gongmo-on
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
