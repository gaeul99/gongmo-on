<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="아이디어를 유사 사례와 비교하고 잘 맞는 공모전을 추천하는 AI 아이디어 분석 서비스" />
    <!-- '공모온' 워드마크 전용 고딕 폰트(Noto Sans KR SemiBold, weight 600 — 최종 확정).
         preload로 CSS보다 먼저 내려받아 첫 화면부터 폰트가 바로 적용되게 한다.
         crossorigin은 같은 오리진이라도 폰트 요청이 CORS 모드로 나가기 때문에 필요하다. -->
    <link rel="preload" href="/fonts/NotoSansKR-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <title>공모온</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
