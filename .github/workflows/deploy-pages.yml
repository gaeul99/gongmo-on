# ==========================================================
# 프론트 배포 — GitHub Pages (2026-10-23)
# main에 푸시하면 프론트를 빌드해 Pages에 올린다.
# 사전 준비(1회): 저장소 Settings → Pages → Source를 'GitHub Actions'로 선택.
#
# 백엔드 API 주소는 저장소 변수로 넣는다:
#   Settings → Secrets and variables → Actions → Variables 탭에
#   VITE_API_BASE_URL = https://<Render 백엔드 주소>
# (변수가 없으면 빌드가 로컬 기본값으로 나가 API가 닿지 않는다)
# ==========================================================
name: 프론트 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci
        working-directory: frontend
      - name: 빌드 (Pages 하위 경로 + Render API 주소 반영)
        run: npm run build
        working-directory: frontend
        env:
          # https://<계정>.github.io/<저장소 이름>/ 하위에 뜨므로 base를 저장소 이름으로 잡는다.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # 백엔드 주소 — 저장소 변수 VITE_API_BASE_URL에서 가져온다.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      # SPA 깊은 주소(/contest/5 등)로 새 탭·새로고침에 들어오면 Pages가
      # 404.html을 대신 서빙한다 — index.html 복제본으로 모든 깊은 주소가 앱으로 들어오게.
      - name: SPA 깊은 주소용 404 대체 파일
        run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
